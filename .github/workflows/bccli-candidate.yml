name: BCCLI candidate integration

on:
  pull_request:
    paths:
      - "integrations/botconnector/**"
      - ".github/workflows/bccli-candidate.yml"
  push:
    branches:
      - "botconnector/compat-poc-20261029"
    paths:
      - "integrations/botconnector/**"
      - ".github/workflows/bccli-candidate.yml"

permissions:
  contents: read

jobs:
  windows-candidate:
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    defaults:
      run:
        working-directory: integrations/botconnector/candidate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: integrations/botconnector/candidate/package-lock.json
      - name: Install pinned upstream dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Static syntax checks
        run: npm run build
      - name: Candidate unit and security tests
        run: npm test
      - name: Upstream-backed integration (Node 24 shutdown gate)
        run: npm run test:integration
