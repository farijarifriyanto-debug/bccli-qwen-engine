name: BCCLI 0.5.0-rc.3 GitHub prerelease

on:
  pull_request:
    paths:
      - "integrations/botconnector/candidate/**"
      - "integrations/botconnector/release/**"
      - ".github/workflows/bccli-rc3-publish.yml"
  push:
    branches:
      - "release/bccli-new-v0.1.0-rc.3"
    paths:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["22", "24"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: integrations/botconnector/candidate/package-lock.json
      - name: Install pinned upstream Qwen runtime
        working-directory: integrations/botconnector/candidate
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check CLI syntax and all offline unit/security tests
        working-directory: integrations/botconnector/candidate
        run: |
          npm run build
          npm test
      - name: Run upstream-backed integration on Windows
        if: runner.os == 'Windows'
        working-directory: integrations/botconnector/candidate
        run: npm run test:integration
      - name: Prepare candidate npm archive (offline; no publication)
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'bccli-rc3-testpack'
          & node integrations/botconnector/release/prepare-next.mjs --out $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Fresh install npm tarball into isolated directory
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'bccli-rc3-test-install'
          New-Item -ItemType Directory -Path $dir | Out-Null
          $tgz = Join-Path (Join-Path $env:RUNNER_TEMP 'bccli-rc3-testpack') 'botconnector-bccli-0.5.0-rc.3.tgz'
          Push-Location $dir
          try {
            & npm install --ignore-scripts --no-audit --no-fund $tgz
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $bin = if ($IsWindows) { Join-Path $dir 'node_modules/.bin/bccli.cmd' } else { Join-Path $dir 'node_modules/.bin/bccli' }
            if (-not (Test-Path $bin)) { throw 'Installed BCCLI binary missing' }
            $version = (& $bin --version | Out-String).Trim()
            if ($LASTEXITCODE -ne 0 -or $version -ne '0.5.0-rc.3') { throw "Unexpected version: $version" }
            $helpText = (& $bin --help | Out-String)
            if ($LASTEXITCODE -ne 0 -or $helpText -notmatch 'BCCLI \| BotConnector Coding Agent' -or $helpText -notmatch 'bccli -r \[SESSION_UUID\]') { throw 'CLI help smoke failed' }
            $env:BCCLI_PREVIEW_HOME = Join-Path $env:RUNNER_TEMP 'empty-provider-config'
            $providers = (& $bin provider list | Out-String)
            if ($LASTEXITCODE -ne 0 -or $providers -notmatch 'Add: bccli provider add openrouter') { throw 'Provider list smoke failed' }
          } finally { Pop-Location }

  github-prerelease:
    name: Publish GitHub preview only, never npm
    needs: [verify]
    if: github.event_name == 'push' && github.ref == 'refs/heads/release/bccli-new-v0.1.0-rc.3'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: integrations/botconnector/candidate/package-lock.json
      - name: Install exact dependency versions
        working-directory: integrations/botconnector/candidate
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build immutable tarball
        run: node integrations/botconnector/release/prepare-next.mjs --out "$RUNNER_TEMP/bccli-publish-rc3"
      - name: Check no release/tag collision and generate checksum
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='bccli-v0.5.0-rc.3'
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "The immutable prerelease already exists; refusing to overwrite it."
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            echo "A matching tag already exists; refusing to overwrite it."
            exit 1
          fi
          cd "$RUNNER_TEMP/bccli-publish-rc3"
          sha256sum botconnector-bccli-0.5.0-rc.3.tgz > SHA256SUMS.txt
          test -s SHA256SUMS.txt
          test -s botconnector-bccli-0.5.0-rc.3.tgz
      - name: Publish tagged GitHub prerelease and assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create 'bccli-v0.5.0-rc.3' \
            "$RUNNER_TEMP/bccli-publish-rc3/botconnector-bccli-0.5.0-rc.3.tgz" \
            "$RUNNER_TEMP/bccli-publish-rc3/SHA256SUMS.txt" \
            --target "$GITHUB_SHA" \
            --title 'BCCLI 0.5.0-rc.3 — new engine preview' \
            --notes-file integrations/botconnector/release/NOTES-0.5.0-rc.3.md \
            --prerelease
          gh release view 'bccli-v0.5.0-rc.3' --json url,tagName,isPrerelease,assets
