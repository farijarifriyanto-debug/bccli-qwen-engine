name: BCCLI 0.5.0 production package
on:
  pull_request:
    paths:
      - "integrations/botconnector/**"
      - ".github/workflows/bccli-production-release.yml"
  push:
    branches:
      - "product"
    paths:
      - "integrations/botconnector/**"
      - ".github/workflows/bccli-production-release.yml"
permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["22", "24"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: integrations/botconnector/candidate/package-lock.json
      - name: Install pinned engine
        working-directory: integrations/botconnector/candidate
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Unit and security tests
        working-directory: integrations/botconnector/candidate
        run: |
          npm run build
          npm test
      - name: Real engine integration tests
        working-directory: integrations/botconnector/candidate
        run: npm run test:integration
      - name: Assemble integrity-pinned production tarball
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'bccli-050-production'
          & node integrations/botconnector/release/prepare-production.mjs --out $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Fresh npm install and SDK/legacy CLI smoke
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'bccli-050-production'
          $tgz = Join-Path $out 'botconnector-bccli-0.5.0.tgz'
          if (-not (Test-Path $tgz)) { throw 'Missing stable package tarball' }
          $dest = Join-Path $env:RUNNER_TEMP 'bccli-050-fresh-install'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          & npm install --prefix $dest --ignore-scripts --no-audit --no-fund $tgz
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bin = if ($IsWindows) { Join-Path $dest 'node_modules/.bin/bccli.cmd' } else { Join-Path $dest 'node_modules/.bin/bccli' }
          if (-not (Test-Path $bin)) { throw 'Missing BCCLI command' }
          $v = (& $bin --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $v -ne '0.5.0') { throw "Wrong installed version: $v" }
          $help = (& $bin --help | Out-String)
          if ($LASTEXITCODE -ne 0 -or $help -notmatch 'BCCLI \| BotConnector Coding Agent') { throw 'BCCLI branding missing' }
          $env:BCCLI_HOME = Join-Path $env:RUNNER_TEMP 'clean-legacy-home'
          $env:BCCLI_PREVIEW_HOME = Join-Path $env:RUNNER_TEMP 'clean-new-home'
          Push-Location $dest
          try {
            & node --input-type=module -e "import('@botconnector/bccli').then(m => { if (typeof m.runTask !== 'function' || typeof m.streamTask !== 'function') process.exit(4) })"
            if ($LASTEXITCODE -ne 0) { throw 'Legacy SDK exports are broken' }
            $mcp = (& $bin mcp list 2>&1 | Out-String)
            if ($LASTEXITCODE -ne 0) { throw 'Legacy MCP management command failed: ' + $mcp }
            $models = (& $bin provider list | Out-String)
            if ($LASTEXITCODE -ne 0 -or $models -notmatch 'botconnector') { throw 'New provider management failed' }
          } finally { Pop-Location }
          Write-Output 'PASS: one BCCLI executable, old SDK, legacy MCP, fresh install'
  release:
    name: Publish immutable GitHub stable release (no npm credentials)
    needs: [verify]
    if: github.event_name == 'push' && github.ref == 'refs/heads/product'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: integrations/botconnector/candidate/package-lock.json
      - name: Install pinned dependencies
        working-directory: integrations/botconnector/candidate
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build verified stable artifact
        run: node integrations/botconnector/release/prepare-production.mjs --out "$RUNNER_TEMP/bccli-050-publish"
      - name: Release if new, never overwrite immutable artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='v0.5.0'
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Stable GitHub release exists; preserving immutable assets."
            exit 0
          fi
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo 'Tag already exists without an accessible release; fail closed.'
            exit 1
          fi
          gh release create "$TAG" \
            "$RUNNER_TEMP/bccli-050-publish/botconnector-bccli-0.5.0.tgz" \
            "$RUNNER_TEMP/bccli-050-publish/SHA256SUMS.txt" \
            --target "$GITHUB_SHA" \
            --title "BCCLI 0.5.0 — production CLI with legacy SDK compatibility" \
            --notes-file integrations/botconnector/release/NOTES-0.5.0.md \
            --latest
          gh release view "$TAG" --json tagName,isPrerelease,assets,url
