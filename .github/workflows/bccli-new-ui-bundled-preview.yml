name: BCCLI new UI bundled engine preview (no audio-capture npm dependency)

on:
  pull_request:
    paths:
      - "integrations/botconnector/**"
      - ".github/workflows/bccli-new-ui-bundled-preview.yml"
  push:
    branches: [product]
    paths:
      - "integrations/botconnector/**"
      - ".github/workflows/bccli-new-ui-bundled-preview.yml"

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["22", "24"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: integrations/botconnector/candidate/package-lock.json
      - name: Install candidate tests without upstream optional audio hook
        working-directory: integrations/botconnector/candidate
        run: npm ci --ignore-scripts --omit=optional --no-audit --no-fund
      - name: Offline source checks and integration tests
        working-directory: integrations/botconnector/candidate
        run: |
          npm run build
          npm test
          npm run test:integration
      - name: Build SHA512-verified upstream engine and stable SDK in one BCCLI package
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'bccli-bundled-052-rc5'
          & node integrations/botconnector/release/prepare-preview-ui.mjs --out $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install tarball and verify npm dependency tree, SDK, CLI and new renderer assets
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'bccli-bundled-052-rc5'
          $archive = Join-Path $out 'botconnector-bccli-0.5.2-rc.5.tgz'
          if (-not (Test-Path $archive)) { throw 'Preview artifact missing' }
          $install = Join-Path $env:RUNNER_TEMP 'bccli-bundled-preview-installed'
          New-Item -ItemType Directory -Path $install -Force | Out-Null
          & npm install --prefix $install --ignore-scripts --no-audit --no-fund $archive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $packagePath = Join-Path $install 'node_modules/@botconnector/bccli'
          $metadata = Get-Content (Join-Path $packagePath 'package.json') -Raw | ConvertFrom-Json
          if ($metadata.version -ne '0.5.2-rc.5') { throw 'Wrong preview version' }
          foreach ($entry in @('engine/cli-entry.js','engine/LICENSE','engine/package.json','legacy/dist/cli.js','legacy/dist/sdk.js','legacy/LICENSE')) {
            if (-not (Test-Path (Join-Path $packagePath $entry))) { throw "Missing bundled runtime file: $entry" }
          }
          $deps = @($metadata.dependencies.PSObject.Properties.Name) + @($metadata.optionalDependencies.PSObject.Properties.Name)
          if (@($deps | Where-Object { $_ -like '@qwen-code/*' }).Count -gt 0) { throw 'Qwen npm dependency must be absent' }
          if (Test-Path (Join-Path $install 'node_modules/@qwen-code')) { throw 'Unexpected Qwen node_modules scope' }
          $v = (& node (Join-Path $packagePath 'cli.mjs') --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $v -ne '0.5.2-rc.5') { throw "Unexpected installed CLI version: $v" }
          Push-Location $install
          try {
            & node --input-type=module -e "import('@botconnector/bccli').then(m=>{if(typeof m.runTask!=='function'||typeof m.streamTask!=='function')process.exit(1)})"
            if ($LASTEXITCODE -ne 0) { throw 'Stable SDK exports missing' }
          } finally { Pop-Location }
          Write-Output 'PASS: new BCCLI UI source, offline package integrity, no npm audio hook, installed SDK and CLI'
