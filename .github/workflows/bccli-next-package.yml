name: BCCLI next package install smoke

on:
  pull_request:
    paths:
      - "integrations/botconnector/candidate/**"
      - "integrations/botconnector/release/**"
      - ".github/workflows/bccli-next-package.yml"

permissions:
  contents: read

jobs:
  next-install:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: integrations/botconnector/candidate/package-lock.json
      - name: Install upstream dependencies into the candidate test workspace
        working-directory: integrations/botconnector/candidate
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build offline prerelease tarball (never publish)
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'bccli-next-rc'
          & node integrations/botconnector/release/prepare-next.mjs --out $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install prerelease tarball into a clean isolated workspace (normal registry)
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'bccli-next-install'
          New-Item -ItemType Directory -Path $dest | Out-Null
          $tarball = Join-Path (Join-Path $env:RUNNER_TEMP 'bccli-next-rc') 'botconnector-bccli-0.5.0-rc.5.tgz'
          Push-Location $dest
          try {
            & npm install --ignore-scripts --no-audit --no-fund $tarball
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $command = if ($IsWindows) {
              Join-Path $dest 'node_modules/.bin/bccli.cmd'
            } else {
              Join-Path $dest 'node_modules/.bin/bccli'
            }
            if (-not (Test-Path $command)) { throw 'Missing installed bccli executable' }
            $version = (& $command --version | Out-String).Trim()
            if ($LASTEXITCODE -ne 0 -or $version -ne '0.5.0-rc.5') { throw "Version mismatch: $version" }
            $helpText = & $command --help | Out-String
            if ($LASTEXITCODE -ne 0 -or $helpText -notmatch 'BCCLI \| BotConnector Coding Agent') { throw 'Help branding mismatch' }
            if ($helpText -match 'isolated coding agent candidate') { throw 'Legacy candidate banner is visible' }
            $env:BCCLI_PREVIEW_HOME = Join-Path $env:RUNNER_TEMP 'bccli-empty-credentials'
            $providers = & $command provider list | Out-String
            if ($LASTEXITCODE -ne 0 -or $providers -notmatch 'Add: bccli provider add openrouter') { throw 'Provider menu branding mismatch' }
            Write-Output "PASS: clean offline install on $env:RUNNER_OS with Node $($env:RUNNER_TOOL_CACHE)"
          } finally {
            Pop-Location
          }
